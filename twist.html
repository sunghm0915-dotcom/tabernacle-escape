<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>③ 반전 — 성막 방탈출</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="stage">
  <canvas class="bg-particles"></canvas>
  <div class="flash"></div>

  <!-- 나중에 영상: assets/video/twist.mp4 (짧은 스팅 효과 영상이면 충분) -->
  <div class="media-slot empty"><video muted playsinline preload="none"></video></div>
  <!-- 효과음: assets/audio/twist.mp3 ("철컥" 소리 등) 라는 이름으로 파일만 올리면 바로 재생됩니다 -->
  <audio class="bgm" preload="none" src="assets/audio/twist.mp3"></audio>

  <button class="replay-btn" aria-label="다시보기">↻</button>

  <div class="start-overlay">
    <div class="room-tag">⑤ 성소 · 숨은 QR (향단 정위치에서만 노출)</div>
    <div class="emblem">?</div>
    <p>화면을 터치하면 시작합니다</p>
  </div>

  <div class="scene-layer" id="scene-a">
    <div class="silhouette-wrap" id="silhouette4" style="width:min(46vw,190px);">
      <svg viewBox="0 0 160 160">
        <path class="draw-line" d="M80,150 L80,60 M55,60 L105,60 L105,40 L55,40 Z M80,40 L80,20"/>
      </svg>
    </div>
    <div class="eyebrow">향단, 정위치</div>
  </div>

  <div class="scene-layer" id="scene-b">
    <div class="empty-pedestal" id="pedestal">
      <svg viewBox="0 0 200 160">
        <path class="draw-line" d="M40,150 L160,150 L160,130 L40,130 Z"/>
        <path d="M60,130 L140,130 L140,70 L60,70 Z" fill="none" stroke="rgba(212,175,90,.28)" stroke-width="1.4" stroke-dasharray="6 6"/>
      </svg>
    </div>
    <div class="eyebrow" style="margin-top:18px;">…</div>
  </div>

  <div class="next-caption">
    <div class="tag">다음 행동</div>
    <div class="msg">언약궤가 없다. 1층으로 내려가 상자를 찾으라</div>
  </div>

  <div class="footer-mark">2026 수학비전캠프 · 성막 방탈출</div>
</div>

<script src="assets/js/particles.js"></script>
<script src="assets/js/scene.js"></script>
<script src="assets/js/bgm.js"></script>
<script>
  startParticles(document.querySelector('.bg-particles'), { color: '#8a6f34', density: 20 });
  initBgm();

  initScene({
    timeline: function () {
      var stage = document.querySelector('.stage');
      var flash = document.querySelector('.flash');
      var a = document.getElementById('scene-a');
      var sil4 = document.getElementById('silhouette4');
      var b = document.getElementById('scene-b');
      var pedestal = document.getElementById('pedestal');
      var cap = document.querySelector('.next-caption');
      return [
        { at: 0,    do: function () { a.classList.add('on'); sil4.classList.add('on'); } },
        { at: 1300, do: function () { flash.classList.add('hit'); stage.classList.add('shake'); } },
        { at: 1500, do: function () { a.classList.remove('on'); } },
        { at: 2000, do: function () { b.classList.add('on'); pedestal.classList.add('on'); } },
        { at: 4800, do: function () { cap.classList.add('on'); } }
      ];
    }
  });
</script>
</body>
</html>
