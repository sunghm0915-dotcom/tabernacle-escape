<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>⑤ 성소 입장 — 성막 방탈출</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="stage">
  <canvas class="bg-particles"></canvas>

  <!-- 나중에 영상: assets/video/entrance.mp4 -->
  <div class="media-slot empty"><video muted playsinline preload="none"></video></div>
  <!-- BGM: assets/audio/entrance.mp3 라는 이름으로 파일만 올리면 바로 재생됩니다 -->
  <audio class="bgm" loop preload="none" src="assets/audio/entrance.mp3"></audio>

  <button class="replay-btn" aria-label="다시보기">↻</button>

  <div class="start-overlay">
    <div class="room-tag">⑤ 성소 · 입구 벽 · 처음 보는 QR</div>
    <div class="emblem">✦</div>
    <p>화면을 터치하면 시작합니다<br><span style="font-size:11px;opacity:.7;">(조장만 스캔, 다 같이 보기)</span></p>
  </div>

  <!-- 휘장 -->
  <div class="curtain left" id="curtainL"></div>
  <div class="curtain right" id="curtainR"></div>

  <div class="scene-layer" id="scene-a">
    <div class="silhouette-wrap" id="silhouette2">
      <svg viewBox="0 0 320 180">
        <path class="draw-line" d="M60,170 L60,60 M60,60 Q40,60 40,40 M60,60 Q80,60 80,40 M60,90 Q45,90 45,70 M60,90 Q75,90 75,70 M60,120 Q48,120 48,100 M60,120 Q72,120 72,100 M30,170 L90,170"/>
        <path class="draw-line" d="M180,170 L180,110 M280,170 L280,110 M170,110 L290,110 M190,105 L190,95 M210,105 L210,90 M230,105 L230,95 M250,105 L250,95" style="animation-delay:.5s"/>
      </svg>
    </div>
    <div class="eyebrow">등잔대 · 진설병상</div>
  </div>

  <div class="scene-layer" id="scene-b">
    <div class="eyebrow">지금까지의 여정</div>
    <div class="compare">
      <div class="card"><b>뜰</b>흩어진 조각을 모으다</div>
      <div class="arrow">→</div>
      <div class="card"><b>성막 본체</b>기구를 조립하다</div>
    </div>
  </div>

  <div class="scene-layer" id="scene-c">
    <div class="line fade-in">이제 너희는<br><b>성소</b> 앞에 섰다.<br>하나님의 기구를<br>제자리에 두라.</div>
  </div>

  <div class="next-caption">
    <div class="tag">다음 행동</div>
    <div class="msg">성소 기구를 순서대로 배치하라 (10분 이내)</div>
  </div>

  <div class="footer-mark">2026 수학비전캠프 · 성막 방탈출</div>
</div>

<script src="assets/js/particles.js"></script>
<script src="assets/js/scene.js"></script>
<script>
  startParticles(document.querySelector('.bg-particles'), { color: '#d4af5a', density: 40 });

  initScene({
    timeline: function () {
      var cl = document.getElementById('curtainL');
      var cr = document.getElementById('curtainR');
      var a = document.getElementById('scene-a');
      var sil2 = document.getElementById('silhouette2');
      var b = document.getElementById('scene-b');
      var c = document.getElementById('scene-c');
      var cap = document.querySelector('.next-caption');
      return [
        { at: 0,     do: function () { cl.classList.add('open'); cr.classList.add('open'); } },
        { at: 1400,  do: function () { a.classList.add('on'); sil2.classList.add('on'); } },
        { at: 6200,  do: function () { a.classList.remove('on'); sil2.classList.remove('on'); } },
        { at: 6700,  do: function () { b.classList.add('on'); } },
        { at: 11700, do: function () { b.classList.remove('on'); } },
        { at: 12200, do: function () { c.classList.add('on'); } },
        { at: 17200, do: function () { cap.classList.add('on'); } }
      ];
    }
  });
</script>
</body>
</html>
